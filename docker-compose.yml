version: "3.9"

services:

  app:
    build: .
    container_name: ai_research_assistant

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      - qdrant


  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_research_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage


volumes:

  qdrant_storage: